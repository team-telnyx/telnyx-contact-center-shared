# Optional overlay. Apply only as part of an explicitly authorized deployment.
services:
  app:
    volumes:
      - cc_video_recordings:/app/.data/video-recordings:ro
    depends_on:
      video-recording-storage:
        condition: service_completed_successfully
  video-recording-storage:
    image: node:22-slim
    user: root
    command: ["sh", "-c", "chown 1000:1000 /recordings && chmod 700 /recordings"]
    volumes:
      - cc_video_recordings:/recordings
    network_mode: none
    restart: "no"
  video-ai:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.video-ai
    env_file: .env
    environment:
      VIDEO_AI_CONTROL_URL: http://video-ai:3092
      VIDEO_AI_CONTROL_PORT: 3092
      VIDEO_AI_BIND: 0.0.0.0
      VIDEO_AI_WORKER_CAPACITY: ${VIDEO_AI_WORKER_CAPACITY:-2}
    depends_on:
      video-recording-storage:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    networks:
      - telnyx-network
    volumes:
      - cc_video_recordings:/app/.data/video-recordings
    # No published port: the application reaches this service on its private
    # Compose network. Use a unique reachable control URL for every replica.
volumes:
  cc_video_recordings:
