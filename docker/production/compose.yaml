services:
  postgres:
    image: postgres:17-alpine
    container_name: telnyx-contact-center-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telnyx-network
    restart: unless-stopped

  app:
    build:
      context: ../../
      dockerfile: docker/production/Dockerfile
    image: telnyx-contact-center-prod
    container_name: telnyx-contact-center-app
    ports:
      - "3000:3000"
      - "3001:3001"  # Streaming WebSocket server (Google Gemini, OpenAI Realtime, Azure)
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      # Persist uploaded media files across container restarts and rebuilds.
      # NOTE: Create this directory on the host before first run:
      # mkdir -p /home/ubuntu/apps/media
      - /home/ubuntu/apps/media:/app/public/media
      # Optional persistent diagnostic logs. Prefer Docker stdout for normal ops;
      # set LOG_FILE_PATH=/app/logs/diagnostics.jsonl when you need JSONL files
      # across container restarts (for example DEBUG_TELNYX_STT=true on GMR).
      # NOTE: Create this directory on the host before first run:
      # mkdir -p /home/ubuntu/apps/logs
      - /home/ubuntu/apps/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telnyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  telnyx-network:
    driver: bridge
