name: ${COMPOSE_PROJECT_NAME:-telnyx-contact-center-ghcr}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telnyx-network
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/team-telnyx/telnyx-contact-center:latest}
    ports:
      - "${APP_PUBLISHED_PORT:-3000}:3000"
      - "${STREAMING_PUBLISHED_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./.env:/app/.env:ro
      - ${MEDIA_DIR:-/home/ubuntu/apps/media}:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telnyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-telnyx-contact-center-ghcr-postgres-data}

networks:
  telnyx-network:
    driver: bridge
